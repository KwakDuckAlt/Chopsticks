<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#262421">
<title>젓가락 게임 (Chopsticks)</title>
<style>
:root{--bg:#262421;--bg2:#2f2d2a;--panel:#33312d;--panel2:#3c3a36;--line:#4a4743;--tx:#ecebe8;--tx2:#aaa7a0;--green:#81b64c;--green2:#6a9a3a;--red:#e5473d;--blue:#4a90f2;--cw:#f3f1ec;--cb:#34343c;--r:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:1rem;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.4;cursor:default}
h1,h2,h3,h4,h5,p{margin:0}
code,.mono,pre{font-family:ui-monospace,Menlo,Consolas,monospace}
code{background:var(--bg);padding:.05em .35em;border-radius:5px;font-size:.88em}
pre{background:var(--bg);padding:.6rem .8rem;border-radius:8px;overflow:auto;font-size:.82rem;line-height:1.5}
kbd{background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .35em;font-size:.8em}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#view-game,#view-analysis{overflow:hidden}
[hidden]{display:none!important}
/* 버튼 */
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:.6rem 1rem;font-weight:600;min-height:2.6rem;transition:background .12s}
.btn:hover:not(:disabled){background:#48453f}
.btn.primary{background:var(--green);border-color:var(--green2);color:#10200a}
.btn.primary:hover:not(:disabled){background:#92c95a}
.btn.danger{background:#7b2a25;border-color:#a33}
.btn.ghost{background:transparent}
.btn.sm{padding:.35rem .7rem;min-height:2.1rem;font-size:.88rem}
.btn.big{padding:.9rem 1.6rem;font-size:1.1rem}
.btn.wide{width:100%;margin-top:.6rem}
.btn.on{background:var(--blue);border-color:var(--blue)}
.ibtn{width:2.6rem;height:2.6rem;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--tx)}
.ibtn:hover:not(:disabled){background:var(--panel2)}
.ibtn.big{width:3rem;height:3rem;background:var(--panel2)}
.ibtn.danger{color:#ff8a80}
.inp,.ta{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;font:inherit}
.ta{resize:vertical;line-height:1.45}
.inp.num{width:5.5rem;text-align:center}
select.inp{padding-right:.3rem}
.seg{display:flex;gap:.25rem;flex-wrap:wrap}
.seg button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.45rem .8rem;font-weight:600}
.seg button.on{background:var(--blue);border-color:var(--blue)}
.row2{display:flex;gap:.5rem;align-items:center}.row2>*{flex:1;min-width:0}.row2.wrap{flex-wrap:wrap}.row2 label{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--tx2)}
.chk{display:flex;gap:.5rem;align-items:center;margin:.5rem 0;font-size:.92rem}
.fl{font-size:.82rem;color:var(--tx2);margin:.8rem 0 .3rem;font-weight:700}
.hint,.note{font-size:.86rem;color:var(--tx2);line-height:1.5;margin:.5rem 0}
.note{background:var(--bg);border-radius:8px;padding:.55rem .75rem}
.ok{color:#9ad463}.bad{color:#ff8a80}.warn{color:#f0c02e}
.sw{appearance:none;width:2.8rem;height:1.55rem;background:#555;border-radius:2rem;position:relative;transition:.15s;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;left:.18rem;top:.18rem;width:1.19rem;height:1.19rem;background:#fff;border-radius:50%;transition:.15s}
.sw:checked{background:var(--green)}.sw:checked::after{left:1.39rem}
/* 토스트 / 모달 */
#toasts{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;width:min(92vw,34rem)}
.toast{background:#111d;border:1px solid var(--line);padding:.6rem 1rem;border-radius:10px;font-size:.92rem;backdrop-filter:blur(6px);transition:.25s;text-align:center}
.toast.err{border-color:#a33;background:#3a1512ee}.toast.out{opacity:0;transform:translateY(8px)}
.mback{position:fixed;inset:0;background:#000a;z-index:100;display:flex;align-items:center;justify-content:center;padding:.8rem}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(30rem,100%);max-height:94%;display:flex;flex-direction:column;box-shadow:0 20px 60px #000a}
.modal.wide{width:min(46rem,100%)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.mhead h3{font-size:1.08rem}.mhead .x{width:2rem;height:2rem;border-radius:8px;display:flex;align-items:center;justify-content:center}
.mbody{padding:1rem;overflow:auto;flex:1;min-height:0}
.mfoot{display:flex;gap:.5rem;padding:.8rem 1rem;border-top:1px solid var(--line);flex-wrap:wrap;justify-content:flex-end}
.pre{white-space:pre-wrap;line-height:1.55}
.errctx{white-space:pre;color:#ffb4ab}
/* 메뉴 */
.menu{max-width:60rem;margin:0 auto;padding:1.4rem 1rem 3rem}
.logo{display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem}.logo h1{font-size:2rem;letter-spacing:-.02em}.logo p{color:var(--tx2);font-size:.9rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.8rem}
.mcard{display:flex;align-items:center;gap:.9rem;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem;text-align:left;transition:.12s;width:100%}
.mcard:hover{background:var(--panel2);transform:translateY(-1px)}
.mcard b{display:block;font-size:1.05rem}.mcard small{color:var(--tx2)}
.mic{width:2.8rem;height:2.8rem;flex:none;color:var(--green)}.mic svg{width:100%;height:100%}
.mcard.resume{background:#2d4220;border-color:var(--green2);margin-bottom:.8rem}
.foot{text-align:center;color:var(--tx2);font-size:.8rem;margin-top:2rem}
.choice{display:grid;gap:.6rem}
/* 페이지 */
.page{max-width:56rem;margin:0 auto;padding:.8rem 1rem 3rem}.page.wide{max-width:78rem}
.phead{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}.phead h2{font-size:1.3rem}.phead .cnt{margin-left:auto;color:var(--tx2);font-size:.9rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:.9rem}
.card h4{margin-bottom:.5rem}.card.empty{text-align:center;color:var(--tx2);padding:2rem}
.tabs{display:flex;gap:.3rem;margin-bottom:.8rem;overflow:auto}.tabs button{padding:.55rem 1rem;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-weight:600;white-space:nowrap}.tabs button.on{background:var(--green);color:#10200a;border-color:var(--green2)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 0;border-bottom:1px solid var(--line)}
.trow.col{flex-direction:column;align-items:stretch;gap:.5rem}.trow.dis{opacity:.45}
.trow small{display:block;color:var(--tx2);font-size:.8rem;margin-top:.15rem;font-weight:400}
.colors{display:flex;gap:.6rem;align-items:center}.colors input{width:2.4rem;height:2rem;border:0;background:none;padding:0}
.settings .sbody{margin-top:.2rem}
.doc h3{margin:1rem 0 .4rem}.doc h3:first-child{margin-top:0}.doc ul{padding-left:1.2rem;line-height:1.75}.doc li{margin:.2rem 0}
.kv{width:100%;border-collapse:collapse;font-size:.88rem}.kv td{padding:.3rem .2rem;border-bottom:1px solid var(--line);vertical-align:top}.kv td:first-child{color:var(--tx2);white-space:nowrap;padding-right:.6rem}.kv i{color:var(--tx2);font-style:normal;margin-left:.3rem}
.keys td:first-child{white-space:nowrap}
/* 게임 레이아웃 */
.gwrap{height:100%;display:flex;flex-direction:column;max-width:100rem;margin:0 auto}
.gbar{display:flex;align-items:center;gap:.4rem;padding:.35rem .6rem;border-bottom:1px solid var(--line);flex:none}
.gtitle{flex:1;min-width:0}.gtitle b{display:block;font-size:.98rem}.gtitle small{display:block;color:var(--tx2);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbtns{display:flex;gap:.1rem;flex:none}
.gevalhost{flex:none;padding:.25rem .8rem 0}
.gmain{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:0}
.stagewrap{display:flex;flex-direction:column;min-height:0;min-width:0;padding:.4rem .6rem}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage.rot{transform:rotate(180deg)}
.bd{flex:1;min-height:0;display:flex}
.pl{display:flex;align-items:center;gap:.5rem;padding:.4rem .8rem;flex:none;background:#0003}
.pl.act{background:#81b64c28}.pl .pname{font-size:.98rem}.ptag{font-size:.72rem;color:var(--tx2);background:var(--bg);padding:.1rem .45rem;border-radius:5px}
.pdot{width:.9rem;height:.9rem;border-radius:50%;display:inline-block;border:2px solid #888;flex:none}.pdot.s0{background:var(--cw)}.pdot.s1{background:var(--cb)}
.clk{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:1.35rem;background:var(--bg);padding:.1rem .6rem;border-radius:8px;min-width:5.2rem;text-align:center}
.pl.act .clk{background:#f3f1ec;color:#222}.pl.warn .clk{background:#f0c02e;color:#222}.pl.low .clk{background:var(--red);color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.65}}
.pthink{font-size:.82rem;color:var(--green)}.pthink i{font-style:normal;animation:dot 1.2s infinite}.pthink i:nth-child(2){animation-delay:.2s}.pthink i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.2}30%{opacity:1}}
.pauseov{position:absolute;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;text-align:center;z-index:20;backdrop-filter:blur(8px)}.pauseov b{font-size:1.6rem;display:block;margin-bottom:.4rem}.pauseov p{color:var(--tx2);margin-bottom:1rem}
.gactions,.navbar{display:flex;gap:.5rem;padding:.5rem 0 0;justify-content:center;align-items:center}
.gactions .btn{flex:1;max-width:14rem}.gactions #gMoves{display:none}
.gactions .btn.on{background:var(--blue)}
.gside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto;padding:.5rem .7rem;background:var(--bg)}
.sidehead{font-weight:700;color:var(--tx2);font-size:.85rem;padding:.4rem 0}
.movelist{display:flex;flex-wrap:wrap;gap:.25rem;align-content:flex-start;overflow:auto;padding:.2rem 0;max-height:18rem;min-height:3rem}
.movelist.big{max-height:none}
.gside>.movelist{flex:1;max-height:none}
.mnum{color:var(--tx2);font-size:.82rem;padding:.35rem .15rem}
.mv{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:.28rem .5rem;font-size:.84rem;font-family:ui-monospace,Menlo,Consolas,monospace;display:inline-flex;gap:.3rem;align-items:center}
.mv.w{border-left:3px solid var(--cw)}.mv.b{border-left:3px solid #111}
.mv.cur{background:var(--blue);border-color:var(--blue)}.mv.blund{border-color:#a33}
.sidefoot{display:flex;gap:.4rem;padding:.5rem 0;flex:none}.sidefoot.wrap{flex-wrap:wrap}
/* 보드 */
.board{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;--hw:110px}
.hrow{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:.3rem}
.bmid{flex:0 0 auto;min-height:3.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.3rem .6rem;gap:.25rem;text-align:center;max-width:100%}
.mstat{font-size:.98rem}.mstat b.turn.s0{color:#fff}.mstat b.turn.s1{color:#c9c9d2}.mlast{font-size:.82rem;color:var(--tx2)}.mlast span{background:var(--bg);padding:.05rem .4rem;border-radius:5px;margin-right:.3rem}
.viewing{color:#f0c02e}
.hand{position:relative;width:var(--hw);height:calc(var(--hw)*1.43);border-radius:16px;background:transparent;border:2px solid transparent;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .12s,border-color .12s,background .12s}
.hand:disabled{opacity:1;cursor:default}
.hand .hbody{width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.hand .hs{width:100%;height:100%}
.hand[data-down="1"] .hs{transform:rotate(180deg)}
.hand .bignum{font-size:calc(var(--hw)*.62);font-weight:800;line-height:1;background:var(--panel2);border-radius:18px;width:92%;height:70%;display:flex;align-items:center;justify-content:center}
.hand[data-side="0"] .bignum{background:var(--cw);color:#222}.hand[data-side="1"] .bignum{background:var(--cb);color:#f3f3f3}
.hand.dead .bignum{opacity:.25}
.hand .paper{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%) rotate(-7deg);background:#fffdf2;color:#222;border:1px solid #b9b49a;box-shadow:0 2px 6px #0006;font-weight:800;font-size:calc(var(--hw)*.26);padding:.02em .35em;border-radius:4px;pointer-events:none;white-space:nowrap}
.hand .paper::before{content:"";position:absolute;left:50%;top:-.3em;width:1.2em;height:.5em;background:#e8d9a0aa;transform:translateX(-50%) rotate(2deg)}
.hand .hbadge{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);min-width:1.7em;height:1.7em;border-radius:1em;background:#000a;color:#fff;font-weight:800;font-size:calc(var(--hw)*.17);display:flex;align-items:center;justify-content:center;padding:0 .3em;border:2px solid #fff3;pointer-events:none}
body.numcol .hand[data-v="1"] .hbadge{background:#2e7d32}body.numcol .hand[data-v="2"] .hbadge{background:#1565c0}body.numcol .hand[data-v="3"] .hbadge{background:#ef6c00}body.numcol .hand[data-v="4"] .hbadge{background:#c62828}
.hand .hlab{position:absolute;top:2px;left:6px;font-size:calc(var(--hw)*.12);color:var(--tx2);opacity:.7;pointer-events:none}
.hand[data-down="1"] .hlab{top:auto;bottom:2px;left:auto;right:6px}
.hand.can{cursor:pointer;border-color:#fff2}.hand.can:hover{background:#ffffff10;transform:translateY(-3px)}
.hand[data-down="1"].can:hover{transform:translateY(3px)}
.hand.sel{border-color:var(--blue);background:#4a90f233;box-shadow:0 0 0 3px #4a90f255,0 0 18px #4a90f288;transform:scale(1.04)}
.hand.tgt{border-color:#e5473d;background:#e5473d18;cursor:pointer;animation:tg 1s infinite}
@keyframes tg{50%{background:#e5473d33}}
.hand.last{background:#f0c02e22;border-color:#f0c02e77}
.hand.best{border-color:var(--green);box-shadow:0 0 0 2px #81b64c66}
.hand.dead{opacity:.55}
.hand.pop .hbody{animation:pop .3s}.hand.justdied .hbody{animation:die .35s}.hand.justrev .hbody{animation:rev .4s}
@keyframes pop{40%{transform:scale(1.14)}}@keyframes die{0%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}@keyframes rev{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.flylayer{position:absolute;inset:0;pointer-events:none;z-index:15}
.flyhand{position:absolute}.flyhand[data-down="1"] .hs{transform:rotate(180deg)}.flyhand .hbody{width:100%;height:100%;display:flex}.flyhand .hs{width:100%;height:100%}
/* 분배 패널 */
.dist{width:min(34rem,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;max-height:46vh;overflow:auto}
.dhead{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}.dmeta{flex:1;font-size:.78rem;color:var(--tx2);text-align:left}.dhead .x{width:1.8rem;height:1.8rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center}
.chip{display:inline-flex;gap:.25rem;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:.4rem .55rem;position:relative;min-height:2.6rem}
.chip:hover{border-color:var(--blue)}.chip .cv{font-style:normal;font-weight:800;font-size:1.15rem;min-width:1.5rem;text-align:center;background:var(--panel2);border-radius:6px;padding:0 .2rem}.chip .cv[data-z="z"]{opacity:.45}.chip small{font-size:.66rem;color:var(--tx2);margin-left:.1rem}
.chip.same{border-style:dashed}.chip.best{border-color:var(--green)}.chip.good{border-color:#bcd92f}.chip .cmark{position:absolute;right:-6px;top:-8px}
.dman{margin-top:.6rem;border-top:1px solid var(--line);padding-top:.5rem}.dmh{font-size:.8rem;color:var(--tx2);margin-bottom:.3rem}.dsteps{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}
.dst{display:flex;align-items:center;gap:.3rem;background:var(--bg);border-radius:9px;padding:.2rem .35rem}.dst .dl{font-size:.75rem;color:var(--tx2)}.dv{min-width:2rem;text-align:center;font-size:1.05rem}
.mn{width:2rem;height:2rem;border-radius:7px;background:var(--panel2);font-weight:800;font-size:1.1rem}.mn:hover{background:var(--blue)}
.dsum{font-size:.8rem;margin:.4rem 0}.dsum.bad{color:#ff8a80}.dsum.ok{color:#9ad463}.dok{width:100%}
/* 평가 막대 */
.ebar{position:relative;height:1.7rem;border-radius:8px;overflow:hidden;background:var(--cb);border:1px solid var(--line)}
.ebar .ew{position:absolute;left:0;top:0;bottom:0;background:var(--cw);transition:width .35s}
.elab{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;font-size:.95rem;mix-blend-mode:normal}.elab.l{left:.6rem;color:#222}.elab.r{right:.6rem;color:#eee}

/* 분석 패널 */
.apan{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;margin-bottom:.5rem;font-size:.88rem;line-height:1.5}

.grh{display:flex;gap:.6rem;align-items:center;margin-bottom:.3rem}.grh small{display:block;color:var(--tx2);font-size:.75rem}.gname{font-size:1.05rem}
.srow{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin:.25rem 0}.srow small{color:var(--tx2);margin-left:auto}.srow.dim,.srow.tiny{color:var(--tx2);font-size:.78rem}

.apan.bar{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.gicon{vertical-align:middle;flex:none}

.acc{text-align:center;margin:.6rem 0}.acc b{font-size:2.2rem;color:var(--green)}.acc small{display:block;color:var(--tx2)}.stn{font-size:.78rem;color:var(--tx2);margin-top:.4rem;text-align:right}
.egraph svg{width:100%;height:7rem;border-radius:8px;display:block}
/* 설정/기타 */
.aset .trow{padding:.6rem 0}.hdet .rrow,.result .rrow{display:flex;justify-content:space-between;gap:1rem;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.rrow span{color:var(--tx2)}.rrow b{text-align:right;word-break:break-word}.rrow b.win{color:var(--green)}
.rbig{font-size:1.7rem;font-weight:800;text-align:center;padding:.8rem;border-radius:12px;margin-bottom:.6rem;background:var(--bg)}.rbig.w{color:#fff}.rbig.b{color:#c9c9d2}.rbig.d{color:#f0c02e}
.rnote{background:#f0c02e22;border:1px solid #f0c02e66;border-radius:10px;padding:.6rem .8rem;margin-bottom:.6rem;font-size:.9rem;line-height:1.5}

<body>
<div id="app">
<section class="view" id="view-menu"></section>
<section class="view" id="view-game" hidden></section>
<section class="view" id="view-analysis" hidden></section>
<section class="view" id="view-history" hidden></section>

</div>
<div id="modals"></div>
<div id="toasts" aria-live="polite"></div>
<script type="text/plain" id="engine-src">
/* ===================================================================
 * 젓가락 게임 공통 엔진 (규칙 · 솔버 · 탐색 · AI · 분석 · PGN · FEN)
 * UI 와 Web Worker 가 동일한 이 코드를 사용한다.
 * 내부 수치는 "단위(unit)" 정수로 보관한다. 소수 분배를 켜면 1단위 = 0.5.
 * =================================================================== */
(function (root) {
'use strict';
var E = {};
var WIN = 100000, WINB = 90000;
E.WIN = WIN; E.WINB = WINB;

function sum(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; }
function numAsc(a, b) { return a - b; }
function sortedCopy(a) { return a.slice().sort(numAsc); }
E.sum = sum;

/* ---------------- 규칙 ---------------- */
E.defaultRules = function () {
  return { death: 5, hands: 2, frac: false, rep: 5, drawWin: true, drawBalance: false, repBan: false };
};
E.normRules = function (r) {
  var d = E.defaultRules(), o = {}, k;
  r = r || {};
  for (k in d) o[k] = (r[k] === undefined) ? d[k] : r[k];
  o.death = Math.max(2, Math.min(30, Math.floor(+o.death) || 5));
  o.hands = Math.max(1, Math.min(6, Math.floor(+o.hands) || 2));
  o.frac = !!o.frac;
  o.rep = (+o.rep === 3 || +o.rep === 0) ? +o.rep : 5;
  o.drawWin = !!o.drawWin;
  o.drawBalance = !!o.drawBalance;
  o.repBan = !!o.repBan && o.rep > 0;
  o.S = o.frac ? 2 : 1;
  o.deathU = o.death * o.S;
  o.M = o.deathU - 1;
  return o;
};
E.ruleCore = function (R) {
  return { death: R.death, hands: R.hands, frac: !!R.frac, rep: R.rep, drawWin: !!R.drawWin, drawBalance: !!R.drawBalance, repBan: !!R.repBan };
};
/* 무승부=승리 규칙으로 동형 무승부가 곧 승리일 때 그 승자 쪽 (-1: 해당 없음). 동형 금기가 켜져 있으면 동형으로 끝나지 않으므로 적용하지 않음 */
E.drawCtx = { ben: -1 };
E.drawEvalSide = function (R, startP) {
  if (!R.drawWin || !(R.rep > 0) || R.repBan) return -1;
  return E.drawBeneficiary(R, startP || E.startPos(R));
};
E.isStandard = function (R) { return R.death === 5 && R.hands === 2 && !R.frac; };
E.solverKey = function (R) { return R.death + '/' + R.hands + '/' + (R.frac ? 1 : 0); };

E.fmt = function (u, S) {
  if (S === 1) return String(u);
  return (u % 2) ? (u / 2).toFixed(1) : String(u / 2);
};
E.fmtHands = function (a, S) { return a.map(function (u) { return E.fmt(u, S); }).join(','); };
E.parseVal = function (str, S) {
  str = String(str).trim();
  if (!/^\d+(\.\d+)?$/.test(str)) return null;
  var v = parseFloat(str);
  if (S === 1) return (Number.isInteger(v)) ? v : null;
  var u = v * 2;
  return (Math.abs(u - Math.round(u)) < 1e-9) ? Math.round(u) : null;
};

/* ---------------- 포지션 ---------------- */
E.startPos = function (R) {
  var a = [], b = [];
  for (var i = 0; i < R.hands; i++) { a.push(R.S); b.push(R.S); }
  return { h: [a, b], t: 0 };
};
E.clonePos = function (P) { return { h: [P.h[0].slice(), P.h[1].slice()], t: P.t }; };
E.key = function (P) { return P.t + '|' + sortedCopy(P.h[0]).join(',') + '|' + sortedCopy(P.h[1]).join(','); };
E.keyFromHands = function (c, me, op) {
  var w = (c === 0) ? me : op, b = (c === 0) ? op : me;
  return c + '|' + w.join(',') + '|' + b.join(',');
};
E.status = function (P) {
  var me = P.t, op = 1 - me, sm = sum(P.h[me]), so = sum(P.h[op]);
  if (sm === 0) return { over: true, winner: op, loser: me, invalid: so === 0 };
  if (so === 0) return { over: true, winner: me, loser: op, invalid: false };
  return { over: false };
};

/* ---------------- 수 생성 ---------------- */
function countDist(n, M, s) {
  var dp = [1], i, j, k, nd;
  for (i = 0; i < n; i++) {
    nd = new Array(Math.min(s, (i + 1) * M) + 1).fill(0);
    for (j = 0; j < dp.length; j++) {
      if (!dp[j]) continue;
      for (k = 0; k <= M && j + k < nd.length; k++) nd[j + k] += dp[j];
    }
    dp = nd;
  }
  return dp[s] || 0;
}
E.countDist = countDist;

E.legalMoves = function (P, R, limit) {
  limit = limit || 3000;
  var me = P.t, op = 1 - me, n = R.hands, hm = P.h[me], ho = P.h[op], att = [], f, t;
  for (f = 0; f < n; f++) if (hm[f] > 0) for (t = 0; t < n; t++) if (ho[t] > 0) att.push({ k: 'a', f: f, t: t });
  var s = sum(hm), total = countDist(n, R.M, s), dists = [], cur = new Array(n);
  (function rec(i, rem) {
    if (dists.length >= limit) return;
    if (i === n - 1) { if (rem <= R.M) { cur[i] = rem; dists.push({ k: 'd', v: cur.slice() }); } return; }
    for (var v = 0; v <= Math.min(R.M, rem); v++) { cur[i] = v; rec(i + 1, rem - v); if (dists.length >= limit) return; }
  })(0, s);
  return { attacks: att, dists: dists, distTotal: total, truncated: total > dists.length };
};

E.checkMove = function (P, R, mv) {
  var me = P.t, op = 1 - me, n = R.hands, S = R.S;
  if (E.status(P).over) return '게임이 이미 종료되었습니다.';
  if (!mv) return '수가 비어 있습니다.';
  if (mv.k === 'a') {
    if (!(Number.isInteger(mv.f) && mv.f >= 0 && mv.f < n)) return '공격하는 손 번호가 올바르지 않습니다.';
    if (!(Number.isInteger(mv.t) && mv.t >= 0 && mv.t < n)) return '공격 대상 손 번호가 올바르지 않습니다.';
    if (P.h[me][mv.f] <= 0) return '소멸한 손(0)으로는 공격할 수 없습니다.';
    if (P.h[op][mv.t] <= 0) return '이미 소멸한 상대 손은 공격할 수 없습니다.';
    return null;
  }
  if (mv.k === 'd') {
    if (!Array.isArray(mv.v) || mv.v.length !== n) return '분배 결과는 손 ' + n + '개의 값이어야 합니다.';
    var s = 0;
    for (var i = 0; i < n; i++) {
      var v = mv.v[i];
      if (!Number.isInteger(v)) return '분배 값이 올바르지 않습니다.';
      if (v < 0) return '분배 값은 음수가 될 수 없습니다.';
      if (v > R.M) return '분배 값은 ' + R.death + ' 미만이어야 합니다 (죽는 수치 ' + R.death + ').';
      s += v;
    }
    var cur = sum(P.h[me]);
    if (s !== cur) return '분배 후 총합이 보존되어야 합니다 (현재 ' + E.fmt(cur, S) + ', 입력 ' + E.fmt(s, S) + ').';
    return null;
  }
  return '알 수 없는 수 종류입니다.';
};

E.applyMove = function (P, R, mv) {
  var me = P.t, op = 1 - me, h = [P.h[0].slice(), P.h[1].slice()];
  if (mv.k === 'a') {
    var z = h[op][mv.t] + h[me][mv.f];
    if (z >= R.deathU) z = 0;
    h[op][mv.t] = z;
  } else {
    h[me] = mv.v.slice();
  }
  return { h: h, t: op };
};
/* 애니메이션용: 변화된 손 */
E.effects = function (P0, P1) {
  var out = { killed: [], revived: [], changed: [] };
  for (var s = 0; s < 2; s++) for (var i = 0; i < P0.h[s].length; i++) {
    var a = P0.h[s][i], b = P1.h[s][i];
    if (a !== b) out.changed.push([s, i]);
    if (a > 0 && b === 0) out.killed.push([s, i]);
    if (a === 0 && b > 0) out.revived.push([s, i]);
  }
  return out;
};

/* ---------------- 표기 ---------------- */
function sideCh(c) { return c === 0 ? 'a' : 'b'; }
E.moveToStr = function (P, R, mv) {
  var me = P.t, op = 1 - me;
  if (mv.k === 'a') return sideCh(me) + (mv.f + 1) + '>' + sideCh(op) + (mv.t + 1);
  return sideCh(me) + '=' + E.fmtHands(mv.v, R.S);
};
E.moveText = function (P, R, mv) {
  var me = P.t, op = 1 - me, nm = me === 0 ? '백' : '흑', on = op === 0 ? '백' : '흑';
  if (mv.k === 'a') return nm + ' 손' + (mv.f + 1) + '(' + E.fmt(P.h[me][mv.f], R.S) + ') → ' + on + ' 손' + (mv.t + 1) + '(' + E.fmt(P.h[op][mv.t], R.S) + ') 공격';
  return nm + ' 분배 ' + E.fmtHands(P.h[me], R.S) + ' → ' + E.fmtHands(mv.v, R.S);
};
E.parseMoveToken = function (tok, P, R) {
  var m, me = P.t, op = 1 - me, n = R.hands;
  if ((m = /^([abAB])(\d+)>([abAB])(\d+)$/.exec(tok))) {
    var s1 = m[1].toLowerCase() === 'a' ? 0 : 1, s2 = m[3].toLowerCase() === 'a' ? 0 : 1;
    if (s1 !== me) return { err: (me === 0 ? '백' : '흑') + ' 차례인데 ' + (s1 === 0 ? '백' : '흑') + ' 손으로 공격하려 했습니다.' };
    if (s2 !== op) return { err: '자신의 손은 공격 대상이 될 수 없습니다.' };
    var f = parseInt(m[2], 10) - 1, t = parseInt(m[4], 10) - 1;
    if (f < 0 || f >= n) return { err: '손 번호 ' + m[2] + ' 는 존재하지 않습니다 (1~' + n + ').' };
    if (t < 0 || t >= n) return { err: '손 번호 ' + m[4] + ' 는 존재하지 않습니다 (1~' + n + ').' };
    return { mv: { k: 'a', f: f, t: t } };
  }
  if ((m = /^([abAB])=([0-9.,]+)$/.exec(tok))) {
    var s3 = m[1].toLowerCase() === 'a' ? 0 : 1;
    if (s3 !== me) return { err: (me === 0 ? '백' : '흑') + ' 차례인데 ' + (s3 === 0 ? '백' : '흑') + ' 손을 분배하려 했습니다.' };
    var parts = m[2].split(','), v = [];
    if (parts.length !== n) return { err: '분배 값 개수가 ' + parts.length + ' 개입니다. 손은 ' + n + '개여야 합니다.' };
    for (var i = 0; i < parts.length; i++) {
      var u = E.parseVal(parts[i], R.S);
      if (u === null) return { err: "분배 값 '" + parts[i] + "' 이(가) 올바르지 않습니다" + (R.frac ? ' (0.5 단위).' : ' (정수만 허용).') };
      v.push(u);
    }
    return { mv: { k: 'd', v: v } };
  }
  return { err: "수 표기를 해석할 수 없습니다: '" + tok + "' (예: a1>b2 , b=2,1)" };
};

/* ---------------- FEN ---------------- */
E.toFEN = function (P, R) {
  return E.fmtHands(P.h[0], R.S) + '/' + E.fmtHands(P.h[1], R.S) + ' ' + (P.t ? 'b' : 'w') + ' ' + R.death + ' ' + R.hands + ' ' + (R.frac ? 1 : 0) +
    ' ' + R.rep + ' ' + (R.drawWin ? (R.drawBalance ? 2 : 1) : 0) + (R.repBan ? ' 1' : '');
};
E.parseFEN = function (str) {
  str = String(str || '').trim();
  if (!str) return { err: 'FEN 이 비어 있습니다.' };
  var tk = str.split(/\s+/);
  if (tk.length < 5) return { err: 'FEN 은 최소 5개 항목이 필요합니다: 손배열 차례 죽는수치 손개수 소수(0/1) [동형 무승부규칙]' };

      }).join('') + '</div></aside><main class="opmain" id="opMain"></main></div></div>';

      { t: '손의 소멸', R: R, P: mk([2, 1], [3, 1]), mv: { k: 'a', f: 0, t: 0 }, text: '손의 수치가 죽는 수치(기본 5) 이상이 되면 그 손은 소멸합니다. 2 + 3 = 5 이므로 상대의 손 하나가 사라집니다. 소멸한 손은 공격할 수도, 공격받을 수도 없습니다.' },
      { t: '분배하기', R: R, P: mk([2, 1], [1, 1]), mv: { k: 'd', v: [3, 0] }, text: '자신의 두 손 수치의 합은 그대로 두고 재분배할 수 있습니다 (2,1 → 3,0 / 1,2 …). 정수여야 하고 음수나 5 이상은 안 됩니다. 기존 배치와 같게 분배하면 사실상 턴 넘기기입니다.' },
      { t: '손 부활', R: R, P: mk([3, 0], [1, 1]), mv: { k: 'd', v: [2, 1] }, text: '소멸한 손(0)도 분배를 통해 다시 살릴 수 있습니다. 3,0 → 2,1 처럼 나누면 죽었던 손이 1로 되살아납니다.' },
      { t: '분배로 소멸', R: R, P: mk([2, 1], [1, 1]), mv: { k: 'd', v: [3, 0] }, text: '분배로 일부러 한 손을 0으로 만들 수도 있습니다. 상대의 공격 대상이 줄어드는 대신 외손이 되어 위험도 커집니다.' },
      { t: '승리와 패배', R: R, P: mk([2, 1], [0, 3]), mv: { k: 'a', f: 0, t: 1 }, text: '상대의 모든 손이 소멸하면 승리합니다. 같은 포지션이 3수/5수 반복되면 무승부이며, 기본 설정의 “무승부는 승리” 규칙에 따라 선공(백)의 승리로 판정됩니다. 시간이 다 되면 시간패입니다.' }
    ];
  },
  draw: function () {
    var v = $('#view-help'), self = this;
    v.innerHTML = '<div class="page"><header class="phead"><button class="ibtn" id="hlBack" aria-label="뒤로">' + IC.back + '</button><h2>게임 규칙 및 도움말</h2></header><div class="tabs" id="hlTabs">' + [['rules', '규칙'], ['tut', '튜토리얼'], ['keys', '단축키'], ['notation', 'PGN / FEN']].map(function (t) { return '<button data-t="' + t[0] + '" class="' + (self.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div><div id="hlBody" class="card doc"></div></div>';
    $('#hlBack').onclick = function () { go('menu'); };
    $$('#hlTabs button', v).forEach(function (b) { b.onclick = function () { self.tab = b.dataset.t; self.step = 0; self.draw(); }; });
    var body = $('#hlBody');
    if (this.tab === 'rules') body.innerHTML = this.rulesHTML();
    else if (this.tab === 'tut') this.tutorial(body);
    else if (this.tab === 'keys') body.innerHTML = this.keysHTML();
    else body.innerHTML = this.notationHTML();
  },
  rulesHTML: function () {
    return '<h3>기본 규칙</h3><ul><li>백(선공)과 흑(후공)이 양손에 손가락 <b>1개씩</b> 펴고 시작합니다.</li><li>한 턴에 <b>공격</b> 또는 <b>분배</b> 중 하나를 선택합니다. 합법적인 수가 없으면 패배합니다 (살아 있는 손이 있으면 항상 “분배(유지)”가 가능합니다).</li><li><b>공격</b>: 내 살아 있는 손 → 상대의 살아 있는 손. 상대 손 = 기존 + 내 손 수치. 죽는 수치(기본 5) 이상이면 소멸합니다.</li><li><b>분배</b>: 내 손들의 수치 합은 유지하며 재분배합니다. 음수·소수(기본)·죽는 수치 이상은 불가능합니다. 소멸한 손도 되살릴 수 있고, 동일한 배치로 분배하면 턴 넘기기입니다.</li><li>상대의 모든 손이 소멸하면 승리합니다.</li></ul>' +
      '<h3>무승부와 반복</h3><ul><li>같은 포지션(양쪽 손의 순서와 무관, 차례 포함)이 <b>5회</b>(설정에서 3회/끄기) 나타나면 무승부입니다.</li><li>기본값 “무승부는 승리”가 켜져 있으면 무승부는 선공(백)의 승리가 됩니다. 결과 화면에는 실제 무승부인지, 규칙으로 승리 처리되었는지 명시됩니다. “밸런스 규칙”을 켜면 시작 포지션이 이미 선공에게 유리할 때 후공의 승리로 조정합니다.</li></ul>' +
      '<h3>시간</h3><ul><li>무제한 · 30분/10분(Rapid) · 5분/3분(Blitz) · 1분/30초(Bullet). 시간이 다 소진되면 시간패입니다.</li><li>피셔 룰(설정): 수를 둘 때마다 Rapid +5초, Blitz +3초, Bullet +1초.</li></ul>' +
      '<h3>커스텀 규칙</h3><ul><li><b>죽는 수치</b>(기본 5), <b>손 개수</b>(기본 2, 최대 6), <b>소수 분배</b>(0.5 단위) 를 바꿀 수 있습니다. 손이 3개 이상이면 모든 손의 수치를 자유롭게 재분배할 수 있습니다.</li><li>6 이상의 수치나 소수 수치는 손가락을 늘리지 않고, 손 위의 <b>종이에 적힌 숫자</b>로 정확한 값을 표시합니다. 소수 수치는 손가락이 내림(floor)으로 표시됩니다.</li><li>기본 규칙(정수·손 2개)처럼 상태 공간이 작을 때 엔진은 <b>모든 포지션을 완전히 해결</b>(역추적 분석)하여 정확한 승/무/패와 승리까지의 수를 제공합니다. 상태 공간이 큰 커스텀 규칙에서는 알파-베타 휴리스틱 탐색을 사용하고 “정확”과 “휴리스틱”을 구분해 표시합니다.</li></ul>' +
      '<h3>수 평가</h3><ul>' + ['brilliant|탁월한 수|겉보기엔 손해지만 승리를 지키는 매우 드문 유일한 수', 'only|유일수|승리/무승부를 유지하는 유일한 수', 'best|최선수|엔진이 계산한 최선의 수', 'excellent|우수한 수|최선수 다음으로 좋은 수', 'good|좋은 수|결과를 크게 해치지 않는 무난한 수', 'book|이론|오프닝 탐색기에 등록된 이론 수순', 'inaccuracy|부정확|결과는 유지하지만 불리해지는 수', 'mistake|실수|상대에게 명확한 이점을 주는 수', 'blunder|블런더|결과를 크게 뒤집는 중대한 실수', 'miss|놓친 수|확정된 승리를 놓친 수'].map(function (s) { var p = s.split('|'); return '<li>' + gradeIcon(p[0], 18) + ' <b>' + p[1] + '</b> — ' + p[2] + '</li>'; }).join('') + '</ul>';
  },
  keysHTML: function () {
    return '<table class="kv keys"><tr><td><kbd>1</kbd>–<kbd>6</kbd></td><td>내 손 선택 → 다시 누르면 상대 손 공격</td></tr><tr><td><kbd>D</kbd></td><td>분배하기 패널 열기/닫기</td></tr><tr><td><kbd>Z</kbd> / <kbd>Y</kbd></td><td>수 취소 / 다시 실행</td></tr><tr><td><kbd>P</kbd></td><td>일시정지 / 계속</td></tr><tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>수순 이동 (대국 중 과거 포지션 보기, 분석, 오프닝)</td></tr><tr><td><kbd>Home</kbd> <kbd>End</kbd></td><td>분석: 처음 / 마지막</td></tr><tr><td><kbd>X</kbd></td><td>분석: 보드 뒤집기</td></tr><tr><td><kbd>F</kbd></td><td>전체 화면</td></tr><tr><td><kbd>Esc</kbd></td><td>선택 취소 / 창 닫기 / 메뉴</td></tr></table>';
  },
  notationHTML: function () {
    return '<h3>수 표기</h3><ul><li>공격: <code>a1&gt;b2</code> = 백(a)의 손1이 흑(b)의 손2를 공격</li><li>분배: <code>a=2,1</code> = 백이 손들을 2,1로 재분배 (소수는 <code>1.5,1.5</code>)</li></ul><h3>PGN</h3><pre>[Event "Chopsticks Game"]\n[White "백"] [Black "흑"] [Result "1-0"]\n[TimeControl "300+3"] [Rules "Standard"]\n[Hands "2"] [DeathThreshold "5"] [Fractional "0"]\n[Repetition "5"] [DrawWin "1"] [StartFEN "1,1/1,1 w 5 2 0 5 1"]\n\n1. a1&gt;b1 {pos=1,1/2,1 clk=299.2} b1&gt;a1 {pos=2,1/2,1}\n2. a=2,1 {...}</pre><p>각 수 뒤 <code>{pos=백손/흑손 clk=남은초}</code> 주석에 실행 결과 포지션과 시계가 기록되며, 불러올 때 엔진 계산과 대조해 불일치하면 위치와 이유를 알려줍니다.</p><h3>FEN</h3><pre>1,1/1,1 w 5 2 0 5 1\n백손들/흑손들  차례(w|b)  죽는수치  손개수  소수(0|1)  동형(0|3|5)  무승부(0|1|2)</pre>';
  },
  tutorial: function (body) {
    var T = this.tut(), st = T[this.step], self = this;
    body.innerHTML = '<div class="tutbar"><b>' + (this.step + 1) + ' / ' + T.length + ' · ' + esc(st.t) + '</b></div><div class="bd tutboard" id="tuBoard"></div><p class="tutxt">' + st.text + '</p><div class="tutnote" id="tuNote"></div><div class="row2 wrap"><button class="btn" id="tuPrev"' + (this.step ? '' : ' disabled') + '>이전</button>' + (st.mv ? '<button class="btn primary" id="tuPlay">이 수 두어 보기</button>' : '') + '<button class="btn" id="tuNext"' + (this.step < T.length - 1 ? '' : ' disabled') + '>다음</button>' + (this.step === T.length - 1 ? '<button class="btn primary" id="tuTry">AI 와 직접 해보기</button>' : '') + '</div>';
    this.board = new Board($('#tuBoard'), {}); this.board.update(st.P, st.R, { view: 0, enabled: function () { return false; } });
    $('#tuPrev').onclick = function () { self.step--; self.draw(); }; $('#tuNext').onclick = function () { self.step++; self.draw(); };
    var pl = $('#tuPlay');
    if (pl) pl.onclick = function () {
      var P1 = E.applyMove(st.P, st.R, st.mv), shown = $('#tuNote').dataset.on === '1';
      if (!shown) { if (st.mv.k === 'a') self.board.flyAttack(st.P.t, st.mv.f, 1 - st.P.t, st.mv.t); self.board.update(P1, st.R, { view: 0, last: Game.lastInfoFor(st.P, st.mv, st.R).hands, enabled: function () { return false; } }); $('#tuNote').dataset.on = '1'; $('#tuNote').innerHTML = '<b>' + esc(E.moveText(st.P, st.R, st.mv)) + '</b> → 결과: 백 ' + E.fmtHands(P1.h[0], 1) + ' / 흑 ' + E.fmtHands(P1.h[1], 1) + (E.status(P1).over ? ' — <b>게임 종료!</b>' : ''); pl.textContent = '처음 상태로'; }
      else { self.board.update(st.P, st.R, { view: 0, enabled: function () { return false; } }); $('#tuNote').dataset.on = '0'; $('#tuNote').innerHTML = ''; pl.textContent = '이 수 두어 보기'; }
    };
    var tr = $('#tuTry'); if (tr) tr.onclick = function () { Settings.v.aiLevel = 2; Settings.v.aiColor = 'w'; Settings.v.tc = 0; openSetup('ai'); };
  }
};

/* ---------- 메뉴 ---------- */
var Menu = {
  refresh: function () {
    var v = $('#view-menu'), a = Game.loadActive(), live = Game.g && (Game.status === 'play' || Game.status === 'paused');
    var items = [
      ['local', '2인 로컬 대국', '한 기기에서 함께'], ['ai', 'AI 대국', '7단계 난이도'], ['analysis', '분석', '엔진 평가 · PGN'], ['history', '경기 역사', History.list().length + '경기 저장됨'],
      ['openings', '오프닝 탐색기', E.openings.list.length + '개 오프닝'], ['share', '게임 공유', '텍스트 · 영상'], ['settings', '설정', '화면 · 규칙 · 데이터'], ['help', '게임 규칙 및 도움말', '튜토리얼'], ['position', '커스텀 포지션', 'FEN 편집']
    ];
    var resume = '';
    if (live || a) {
      var g = live ? Game.g : a.g;
      resume = '<button class="mcard resume" data-m="resume"><span class="mic">' + MENU_ICONS.resume + '</span><span><b>이어하기</b><small>' + esc(g.white + ' vs ' + g.black + ' · ' + g.moves.length + '수') + '</small></span></button>';
    }
    v.innerHTML = '<div class="menu"><div class="logo"><svg viewBox="0 0 120 172" width="46" height="66" aria-hidden="true"><g>' + $('svg', elFrom('<div>' + handSVG({ fingers: 2, fill: '#f3f1ec', stroke: '#8a877d', sleeve: '#d2cfc6' }) + '</div>')).innerHTML + '</g></svg><div><h1>젓가락 게임</h1><p>Chopsticks · 전략 대국 플랫폼</p></div></div>' + resume + '<div class="mgrid">' +
      items.map(function (it) { return '<button class="mcard" data-m="' + it[0] + '"><span class="mic">' + MENU_ICONS[it[0]] + '</span><span><b>' + it[1] + '</b><small>' + esc(it[2]) + '</small></span></button>'; }).join('') + '</div><p class="foot">모든 기록은 이 기기에만 저장됩니다 · 서버 없이 동작</p></div>';
    $$('.mcard', v).forEach(function (b) { b.onclick = function () { Menu.go(b.dataset.m); }; });
  },
  go: function (m) {
    if (m === 'local') openSetup('local'); else if (m === 'ai') openSetup('ai');
    else if (m === 'resume') { if (Game.g && (Game.status === 'play' || Game.status === 'paused')) { go('game'); } else Game.resumeActive(); }
    else if (m === 'analysis') {
      var api = modal({
        title: '분석', html: '<div class="choice"><button class="mcard" data-c="new"><span class="mic">' + MENU_ICONS.analysis + '</span><span><b>새 게임 분석하기</b><small>기본 포지션에서 직접 수를 두며 분석</small></span></button><button class="mcard" data-c="pgn"><span class="mic">' + MENU_ICONS.history + '</span><span><b>PGN 으로 분석</b><small>복사한 PGN 을 붙여넣어 경기 분석</small></span></button><button class="mcard" data-c="hist"><span class="mic">' + MENU_ICONS.history + '</span><span><b>경기 역사에서 분석</b><small>저장된 경기를 선택</small></span></button><button class="mcard" data-c="pos"><span class="mic">' + MENU_ICONS.position + '</span><span><b>커스텀 포지션 / FEN</b><small>직접 만든 포지션에서 분석</small></span></button></div>'
      });
      $$('[data-c]', api.body).forEach(function (b) {
        b.onclick = function () {
          var c = b.dataset.c; api.close();
          if (c === 'new') Analysis.openMini(Settings.rules(), null);
          else if (c === 'pgn') { var ta = elFrom('<textarea class="ta" rows="10" placeholder="PGN 을 붙여넣으세요"></textarea>'); modal({ title: 'PGN 분석', node: ta, buttons: [{ label: '취소' }, { label: '분석 시작', cls: 'primary', cb: function () { var g = parsePGNOrWarn(ta.value); if (!g) return false; Analysis.openGame(g, { mode: 'analyze' }); } }] }); }
          else if (c === 'hist') { go('history'); toast('분석할 경기를 선택하세요'); }
          else go('position');
        };
      });
    }
    else go(m);
  }
};

/* ---------- 부팅 ---------- */
viewHooks.menu = { enter: function () { Menu.refresh(); } };
viewHooks.game = { enter: function () { Game.render(true); }, leave: function () { if (Game.status === 'play') Game.pause(); } };
viewHooks.analysis = { enter: function () { Analysis.render(); }, leave: function () { Analysis.tok++; } };
viewHooks.history = { enter: function () { HistoryView.enter(); } };
viewHooks.openings = { enter: function () { Openings.enter(); } };
viewHooks.share = { enter: function () { Share.enter(); } };
viewHooks.settings = { enter: function () { SettingsView.enter(); } };
viewHooks.help = { enter: function () { Help.enter(); } };
viewHooks.position = { enter: function () { PosEditor.enter(); } };

window.addEventListener('cs-settings', function () { if (currentView === 'game') Game.render(); else if (currentView === 'analysis') Analysis.render(); else if (currentView === 'openings' && Openings.board) Openings.stepRender(); });
document.addEventListener('keydown', function (e) {
  var tg = e.target && e.target.tagName; if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape' && modalStack.length) { closeTopModal(); e.preventDefault(); return; }
  if (modalStack.length) return;
  if (Game.keydown(e) || Analysis.keydown(e) || Openings.keydown(e)) return;
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === '?') go('help');
});
function persistNow() { try { if (Game.g && Game.status === 'play') Game.saveActive(); else if (Game.g && Game.status === 'paused') Game.saveActive(); } catch (e) { } }
window.addEventListener('pagehide', persistNow); window.addEventListener('beforeunload', persistNow);
document.addEventListener('visibilitychange', function () { if (document.hidden) persistNow(); });
setInterval(function () { if (Game.status === 'play') Game.saveActive(); }, 4000);
window.addEventListener('error', function (e) { console.error(e.message); toast('오류: ' + e.message, 'err', 4000); });
window.addEventListener('unhandledrejection', function (e) { var m = e.reason && e.reason.message; if (m === 'cancelled') return; console.error(e.reason); });

function boot() {
  Engine.init(); applyVisual();
  Game.build(); Analysis.build();
  window.addEventListener('resize', function () { applyVisual(); });
  History.load();
  go('menu');
  try { history.replaceState({ v: 'menu' }, ''); } catch (e) { }
  if (E.openings.errors.length) console.warn('오프닝 검증 오류', E.openings.errors);
  var a = Game.loadActive();
  if (a) setTimeout(function () { toast('진행 중이던 경기가 있습니다. “이어하기”로 복구하세요.', '', 4200); }, 500);
  window.__csReady = true;
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
